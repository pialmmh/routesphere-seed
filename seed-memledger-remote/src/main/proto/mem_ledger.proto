// mem-ledger on the wire — ARCH-0117 (the owner 2026-11-09 17:4xZ: "refactor out the existing, working version of mem-ledger into a
// separate service, that will act like a database server. apps shall use grpc … the same single api that accepts WalEntryBatch and be
// transaction/atomic"). Design: routesphere docs/architecture/mem-ledger-as-a-database-server-2026-11-09.md §2.
//
// The surface is mem-ledger's own (f739824, com.telcobright.memledger.api.MemLedger): the eight methods the seed's engine calls, and
// health(). No money rule is on this wire: the engine (reserve, settle, the locks, the reaper) stays in the application.
//
// Frozen since item 1 landed (a change is the architect's): the service name, the method names, the fields of ApplyRequest, WalEntry,
// ApplyReply and HealthReply with their numbers, and Op's values.
//
// Meaning on the wire:
//  - Apply is THE write: execCrud(WALEntryBatch). Every entry is checked before anything is written; the batch is ONE record of the
//    WAL; all of it or none. A REFUSAL (a row the cache does not hold, one it already holds, a lock not free, a bad entry) is gRPC
//    status OK with applied = 0, the ledger's words in message and a refusal_code — nothing changed. A FAULT (the ledger is reloading,
//    its WAL would not append, it is stopped) is UNAVAILABLE or INTERNAL.
//  - A batch is known by its transaction_id: the same id sent again answers already_applied = true and writes nothing twice (the
//    client repeats a batch ONCE after a deadline, under the same id).
//  - A row is entity_json: a JSON object of the row's fields by their Java names, as the registered entity class declares them; money
//    is DECIMAL TEXT inside it (BigDecimal.toPlainString, its scale kept), never a float or a double; a date is ISO-8601 text; an
//    absent field is null. Both sides decode it into the class registered under entity_name.
//  - entity_id is the row's key as text (a number, a call's uuid, a product key); the server reads it as the key type of the class.
//  - Reads answer what the cache holds now; the application is the ONE writer of its ledger, so what it read is what it will change.
//
// ARCH-0118 (the owner 2026-11-10: "same cached tables … shared used through the same instance by both ad-sphere and wifi-sphere") —
// TWO writers on one instance, additive in both directions (every number above unchanged; an old client and an old server ignore what
// they do not know):
//  - expects (ApplyRequest field 3): the rows the batch's unit READ, each as the client read it (present = false: it saw none). The
//    server checks them under the rows' locks against what its cache holds; one that differs refuses the WHOLE batch with
//    refusal_code STALE and words naming the row and the first field that differs — nothing changed. An old client sends none.
//  - ghosts_taken_out (ReloadReply field 5): the reserve rows the server's own reload brought back and took out at once (a reload is
//    add-only; a settled reserve whose row the write-behind has not deleted yet is a ghost). Taken under a server-wide gate no write
//    passes, so another application's new reserve is never one.
//  - capabilities (HealthReply field 6): what the server does, a word each — "ghosts" (it takes the ghosts out itself: the client must
//    not), "expect" (it checks expects). A server that says neither is an older one: its client keeps the client-side ghost rule and
//    sends no expects — one writer per instance.
//
// ARCH-0119 (the owner 2026-11-10: "safe apis to remove the concerns of multi-threading"; "1 sec max lock"; a bounded queue per account,
// full = refused at once; "you do the best design in recall db, to handle concurrency") — additive in both directions, as ARCH-0118 was:
//  ROAD 1 · ATOMIC. An entry may be a PATCH: not the new row, but what to CHANGE in the row the cache holds (changes) and what must HOLD
//    for the row after the changes (guards). The server reads the row, changes it, checks it and writes it under the batch's own row
//    locks — one call, and no lock ever waits on the network. A guard not met refuses the WHOLE batch with refusal_code GUARD: nothing
//    changed; failed_entry names the entry and failed_row_json is the row as the cache holds it. insert_if_absent = "change it, or
//    create it" (entity_json is then the row to insert when the cache holds none). The reply's results carry every PATCHed row as the
//    batch left it. The WAL still gets whole rows: the server hands mem-ledger an UPDATE or an INSERT.
//    No money word is on this wire: the CLIENT names the fields and the numbers.
//  ROAD 2 · LEASE. ReadForUpdate locks every row named — all of them or none — and answers them as the cache holds them now, with a
//    token. The lock is held lease_ms at most (never more than the server's maximum, 1000 ms), then the server takes it back by itself.
//    ApplyLocked = this batch is written under that lock; after its answer the lock is released, whatever the answer was. It is a
//    METHOD of its own, never a field of ApplyRequest: an older server ignores a field it does not know and would write the batch with
//    no lock at all, while a method it does not know is refused (UNIMPLEMENTED). A lock
//    that is no longer the holder's (its lease ran out; the server restarted) refuses the batch with refusal_code LOCK_LOST. A locked
//    batch may change a row it holds, a row it carries as read (expects), or a new row; anything else is NOT_COVERED. Unlock releases a
//    lock that will not be written under; asked twice it answers released = false.
//    A request that cannot be granted waits in a bounded queue per row (max_wait_ms, never past its own deadline); a row whose queue is
//    full refuses the request AT ONCE: granted = false, refusal_code QUEUE_FULL. A lock refused is an ANSWER (status OK), never a fault.
//  capabilities: "patch" (road 1), "lease" (road 2). A client told to use a road refuses to start against a server that does not say it.
syntax = "proto3";

package telcobright.memledger.v1;

option java_package = "com.telcobright.seed.memledgerremote.wire";
option java_multiple_files = true;
option java_outer_classname = "MemLedgerProto";

service MemLedger {
  rpc Apply               (ApplyRequest)  returns (ApplyReply);        // execCrud(WALEntryBatch): all or nothing, one WAL record
  rpc GetEntity           (EntityKey)     returns (EntityReply);       // getEntity(db, entity, id): the cache's row, or found = false
  rpc GetAllEntities      (EntityTable)   returns (stream EntityRow);  // getAllEntities(db, entity): every row the cache holds
  rpc CacheStatistics     (Nothing)       returns (StatisticsReply);   // getStats().getCacheStatistics()
  rpc RegisteredDatabases (Nothing)       returns (DatabaseList);      // getRegisteredDatabases()
  rpc ReloadNewRows       (ReloadRequest) returns (ReloadReply);       // reloadNewRows(): add-only, above each table's mark
  rpc AddDatabase         (DatabaseName)  returns (AddDatabaseReply);  // addDatabase(schema): a tier created at run time
  rpc Health              (Nothing)       returns (HealthReply);       // health() + getRegisteredDatabases()
  rpc ReadForUpdate       (LockRequest)   returns (LockReply);         // ARCH-0119 road 2: lock the rows (all or none) and read them
  rpc ApplyLocked         (ApplyLockedRequest) returns (ApplyReply);   // ARCH-0119 road 2: Apply under that lock; the lock ends with the answer
  rpc Unlock              (UnlockRequest) returns (UnlockReply);       // ARCH-0119 road 2: release a lock that will not be written under
}

// ── the write ───────────────────────────────────────────────────────────────

message ApplyRequest {
  string   transaction_id = 1;   // the batch's id; the WAL record's; a repeat under it is answered, never applied twice
  repeated WalEntry entries = 2; // one row each; the same row twice in one batch is refused
  repeated Expectation expects = 3; // ARCH-0118: the rows the batch read, as read; any one that differs now = STALE, nothing written
}

// ARCH-0119 road 2 · A batch written under a lock: the caller's own id of the lock, the token ReadForUpdate answered, and the batch as
// Apply takes it (its transaction_id, entries and expects mean what they mean there).
message ApplyLockedRequest {
  string       lock_id = 1;
  string       token   = 2;
  ApplyRequest batch   = 3;
}

// ARCH-0118 · One row as the client READ it before deciding the batch: compared field by field with what the cache holds under the
// batch's row locks (a decimal by its value, so 10 and 10.000000 are the same; every other field by equality).
message Expectation {
  string db_name     = 1;        // the tier's schema
  string entity_name = 2;        // the name the entity is registered under
  string entity_id   = 3;        // the row's key as text
  bool   present     = 4;        // false = the client saw NO such row (an INSERT's premise)
  string entity_json = 5;        // the row as read (present = true), a JSON object of its fields as in WalEntry; empty when absent
}

message WalEntry {
  string db_name     = 1;        // the tier's schema
  string entity_name = 2;        // the name the entity is registered under (PackageAccount, PackageAccountReserve, …)
  Op     op          = 3;
  string entity_id   = 4;        // the row's key as text
  string entity_json = 5;        // the post-image (INSERT, UPDATE); empty for DELETE; PATCH + insert_if_absent: the row to insert
  repeated Change changes = 6;   // ARCH-0119 road 1 (PATCH): applied in this order to the row the cache holds
  repeated Guard  guards  = 7;   // ARCH-0119 road 1 (PATCH): each must hold for the row AFTER the changes, or the whole batch is refused GUARD
  bool insert_if_absent   = 8;   // ARCH-0119 road 1 (PATCH): the cache holds no such row → INSERT entity_json (changes are NOT applied to it)
}

// ARCH-0119 · One change of one field of the row the cache holds. A decimal travels as text; arithmetic is exact (BigDecimal).
message Change {
  string     field      = 1;     // the field's Java name, as in entity_json
  ChangeKind kind       = 2;
  string     value      = 3;     // ADD, MIN: a decimal as text · SET: a JSON value (a decimal as "text", null, a string, a number)
  string     from_field = 4;     // COPY: the field whose value THE ROW HAD BEFORE this entry's changes
}

enum ChangeKind {
  CHANGE_UNSPECIFIED = 0;        // refused
  ADD  = 1;                      // field = field + value (value may be negative); a null field counts as 0
  SET  = 2;                      // field = value
  COPY = 3;                      // field = the row's from_field as it was before this entry
  MIN  = 4;                      // field = the smaller of field and value
}

// ARCH-0119 · What must hold for the row after the entry's changes. Two numbers are compared by value (10 = 10.000000); when the
// field or the value is no number they are compared as TEXT (a status word by equality; an ISO-8601 date or date-time of one shape
// orders as its text does). A guard sees the row the CACHE holds — a row the database holds and the cache does not is not seen.
message Guard {
  GuardKind kind  = 1;
  string    field = 2;           // empty for ROW_ABSENT
  string    value = 3;           // a decimal, a word or a date, as text; empty for ROW_ABSENT
}

enum GuardKind {
  GUARD_UNSPECIFIED = 0;         // refused
  FIELD_GE = 1;                  // field >= value
  FIELD_EQ = 2;                  // field = value
  FIELD_LE = 3;                  // field <= value
  ROW_ABSENT = 4;                // the cache holds NO such row (an entry with this guard carries no change and never inserts)
}

enum Op {
  OP_UNSPECIFIED = 0;            // refused: a batch says what each entry does
  INSERT = 1;
  UPDATE = 2;
  DELETE = 3;
  PATCH  = 4;                    // ARCH-0119 road 1: change the row the cache holds (changes, guards) — the server computes the new row
}

message ApplyReply {
  int32  applied         = 1;    // 0 (refused, nothing changed) or the number of entries (all of them)
  string message         = 2;    // the ledger's words
  string refusal_code    = 3;    // empty when applied; REFUSED otherwise — STALE (ARCH-0118) when a row the batch read is not what it read
  bool   already_applied = 4;    // this transaction_id was applied before: nothing was written again
  repeated RowResult results = 5; // ARCH-0119 road 1: every PATCHed row as the batch left it, in the batch's order (also on a repeat)
  int32  failed_entry    = 6;    // ARCH-0119 road 1, refusal_code GUARD: the entry (1 = the first) whose guard did not hold; else 0
  string failed_row_json = 7;    // ARCH-0119 road 1, refusal_code GUARD: that entry's row as the cache holds it (unchanged); empty = none
}
// refusal_code since ARCH-0119: GUARD (road 1: a guard did not hold) · LOCK_LOST, NOT_COVERED (road 2) — each = nothing changed.
// refusal_code IN_DOUBT (2026-11-13, every road): a row the batch names was written by a batch whose outcome is UNKNOWN and is not
// settled yet. The server does not read that row for a write and does not write it: nothing changed, BUSY — try again. The message
// keeps the ledger's words ("… outcome of txn T unknown — retry after it settles"). A READ of such a row (GetEntity, a list of its
// entity) is UNAVAILABLE with the same words: a row in doubt is not readable.

// ARCH-0119 · One PATCHed row after the batch.
message RowResult {
  string db_name     = 1;
  string entity_name = 2;
  string entity_id   = 3;
  bool   inserted    = 4;        // the cache held none and insert_if_absent created it
  string entity_json = 5;        // the row as the batch left it
}

// ── ARCH-0119 road 2: the lease ─────────────────────────────────────────────

message LockRequest {
  string lock_id      = 1;       // the caller's own id of this lock (a UUID): it can Unlock by it even if it never reads the answer
  repeated EntityKey rows = 2;   // every row to lock: all of them, or none
  int32  lease_ms     = 3;       // how long it may hold them; 0 = the server's default; never more than the server's maximum
  int32  max_wait_ms  = 4;       // how long it may wait in the rows' queues; 0 = do not queue (granted now, or refused now)
  string client       = 5;       // who asks, for the server's log
}

message LockReply {
  bool   granted      = 1;
  string refusal_code = 2;       // empty when granted; QUEUE_FULL | NOT_FREE_IN_TIME | IN_DOUBT (a row asked is in doubt) | TOO_MANY_ROWS | REFUSED
  string message      = 3;       // the server's words
  string token        = 4;       // names this lock for its write (ApplyLockedRequest.token)
  int32  lease_ms     = 5;       // the lease given, from the grant, on the server's clock
  repeated LockedRow rows = 6;   // every row asked, as the cache holds it now, in the order asked
}

message LockedRow {
  EntityKey key       = 1;
  bool   found        = 2;       // false = the cache holds none (the key is locked all the same)
  string entity_json  = 3;
}

// token: the holder's own (LockReply.token). A lock that is HELD is given back only to its token — a stranger's Unlock, or a late
// Unlock of an earlier round under the same id, releases nothing (A-0147 A1). A request still WAITING has no token: its id withdraws it.
message UnlockRequest { string lock_id = 1; string token = 2; }
message UnlockReply   { bool released = 1; }   // false = nothing of that id was held or waiting (asked twice, a lease that ran out)

// ── the reads ───────────────────────────────────────────────────────────────

message EntityKey   { string db_name = 1; string entity_name = 2; string entity_id = 3; }
message EntityReply { bool found = 1; string entity_json = 2; }

message EntityTable { string db_name = 1; string entity_name = 2; }
message EntityRow   { string entity_id = 1; string entity_json = 2; }

message Nothing {}

// The cache's statistics as mem-ledger gives them (a map of maps: cache_contents → schema → entity → count), as JSON.
message StatisticsReply { string statistics_json = 1; }

message DatabaseList { repeated string names = 1; }

// ── the tiers and the reload ────────────────────────────────────────────────

message ReloadRequest {}

message ReloadReply {
  int32    added   = 1;                    // entities merged into the cache (add-only)
  int64    scanned = 2;                    // rows read
  repeated ReloadFailure failures = 3;     // one per (tier, entity) that could not be read; empty = a complete reload
  repeated string kept_not_read = 4;       // the entities loaded at the start only: kept as held, not read
  int32    ghosts_taken_out = 5;           // ARCH-0118: of added, the reserve rows brought back that the server took out again at once
}

message ReloadFailure { string schema = 1; string entity = 2; string reason = 3; }

message DatabaseName { string name = 1; }

message AddDatabaseReply { bool added = 1; string message = 2; }

// ── health ──────────────────────────────────────────────────────────────────

message HealthReply {
  bool   ready   = 1;                      // initialized, serving, not stopped
  int64  wal_lag = 2;                      // WAL records appended and not yet written to the database; -1 = not known
  repeated Database databases = 3;         // every registered tier
  string persistence = 4;                  // the write-behind: OK | DEGRADED | DEAD
  string version     = 5;                  // the server's
  repeated string capabilities = 6;        // ARCH-0118: "ghosts", "expect" — none = an older server (one writer per instance)
}

message Database { string name = 1; bool loaded = 2; }
